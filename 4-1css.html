<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }
        #box{
            width:480px;
            padding:8px;
            border:1px solid #ccc;
            font-size:12px;
            margin:20px;
        }
        #box h3{
            font-size:16px;
            /* 居中 */
            text-align:center;
            /* 行高33px */
            line-height:33px;
            /* 字间距3px */
            letter-spacing:3px;
            color:royalblue;
        }
        #box p{
            /* 行高150% */
            line-height:150%;
            color:#666;
            /* 首行缩进2em */
            text-indent:2em;
        }
        #box a{
            color:#f11;
            text-decoration:none;
            /* 加粗 */
            font-weight:bold;
        }
        /* 下面是新增扩展样式，原有代码完全没改动 */
        .xuehao{
            color: royalblue;
            font-weight: bold;
        }
        .mname{
            color: #333;
            font-weight: bold;
        }
        .nandu{
            color: red;
            font-weight: bold;
        }
        .zhishidian{
            border:1px solid rgb(91, 2, 91);
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号：<span class="xuehao">0423</span>，姓名：<span class="mname">王一诺</span>，班级：计算机24004，对于《高级网页设计》课程的难度认知为：<span class="nandu">正常</span>，
            <span class="zhishidian">这个例子对应的知识点是：群组选择器，后代选择器，层叠与继承</span>
            <a href="#">更多>></a>
        </p>
    </div>
    <!-- 扩展：学号：蓝色加粗，姓名：深色加粗，难度的值：红色加粗
     知识点：紫色边框，边框为额外内容 -->
</body>
</html>
