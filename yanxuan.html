<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页元素设计四级项目‑24001010423 王一诺</title>
    <style>
        /* 全局公共CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei",sans-serif;
            background: #f7f7f7;
        }
        ul {
            list-style: none;
        }
        a {
            text-decoration: none;
            color:#333;
        }
        img {
            width:100%;
            display:block;
        }
        .wrap {
            width:1200px;
            margin: 0 auto;
        }

        /* ==========模块1：上图‑下文商品卡片（人气推荐）========== */
        .goods-area {
            background:#ffffff;
            padding:30px 0 40px;
            margin-top:20px;
        }
        .area-title {
            font-size:22px;
            padding-left:10px;
            border-left:4px solid #c81623;
            margin-bottom:24px;
        }
        .goods-list {
            display:flex;
            gap:18px;
        }
        /* 单个卡片：上图下文 */
        .goods-card {
            width:184px;
            border:1px solid #eeeeee;
            background:#fff;
        }
        /* 上面：图片 */
        .card-img-box {
            width:100%;
            height:170px;
        }
        .card-img-box img {
            width:100%;
            height:100%;
            object-fit:contain;
        }
        /* 下面：文字信息 */
        .card-text-box {
            padding:12px 10px;
        }
        .goods-name {
            font-size:14px;
            line-height:1.4;
            height:40px;
            overflow:hidden;
            margin-bottom:8px;
        }
        .price-now {
            font-size:16px;
            color:#c81623;
            font-weight:bold;
        }
        .price-old {
            font-size:12px;
            color:#999;
            text-decoration:line-through;
            margin-left:6px;
        }
    </style>
</head>
<body>
<!-- 24001010423 王一诺 四级项目 -->

<div class="wrap">
    <!-- 模块1：上图下文商品卡片 【实验要求：上图下文，本地图片】 -->
    <div class="goods-area">
        <h2 class="area-title">人气推荐</h2>
        <div class="goods-list">

            <div class="goods-card">
                <div class="card-img-box">
                    <img src="./img/41.png" alt="纽仕兰牛奶">
                </div>
                <div class="card-text-box">
                    <p class="goods-name">纽仕兰新西兰4.0g蛋白低脂纯牛奶</p>
                    <span class="price-now">¥99</span>
                    <span class="price-old">¥109</span>
                </div>
            </div>

            <div class="goods-card">
                <div class="card-img-box">
                    <img src="./img/42.png" alt="香薰">
                </div>
                <div class="card-text-box">
                    <p class="goods-name">浴室香薰空气清新香氛</p>
                    <span class="price-now">¥14.9</span>
                    <span class="price-old">¥19.9</span>
                </div>
            </div>

            <div class="goods-card">
                <div class="card-img-box">
                    <img src="./img/43.png" alt="吐司面包">
                </div>
                <div class="card-text-box">
                    <p class="goods-name">绵绵云朵牛奶吐司面包</p>
                    <span class="price-now">¥18.9</span>
                    <span class="price-old">¥22</span>
                </div>
            </div>

            <div class="goods-card">
                <div class="card-img-box">
                    <img src="./img/44.png" alt="洗衣液">
                </div>
                <div class="card-text-box">
                    <p class="goods-name">英国梨香酵素除菌除螨洗衣液</p>
                    <span class="price-now">¥16.8</span>
                    <span class="price-old">¥17.9</span>
                </div>
            </div>

            <div class="goods-card">
                <div class="card-img-box">
                    <img src="./img/45.png" alt="婴儿湿巾">
                </div>
                <div class="card-text-box">
                    <p class="goods-name">网易严选婴儿保湿柔湿巾</p>
                    <span class="price-now">¥29.9</span>
                    <span class="price-old">¥35</span>
                </div>
            </div>

            <div class="goods-card">
                <div class="card-img-box">
                    <img src="./img/46.png" alt="卫生巾">
                </div>
                <div class="card-text-box">
                    <p class="goods-name">婴儿棉柔系列Airfree卫生巾</p>
                    <span class="price-now">¥9.9</span>
                    <span class="price-old">¥52.9</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
