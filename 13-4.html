<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="移动端底部固定自适应导航：内联 SVG sprite 实现，含数字徽章与红点">
    <title>13-4 · SVG 底部导航</title>
    <style>
        :root {
            --ink: #172b3a;
            --muted: #8a9aa5;
            --paper: #eef1f4;
            --surface: #ffffff;
            --line: #e5eaee;
            --teal: #087f78;
            --yellow: #f4c95d;
            --coral: #e87561;
            --red: #ff4d4f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background:
                radial-gradient(circle at 20% 0%, rgba(232, 117, 97, 0.16), transparent 30rem),
                var(--paper);
            line-height: 1.6;
        }

        .wang_sprite { display: none; }

        .wang_ic { display: inline-block; }

        .wang_phone {
            width: 100%;
            min-height: 100vh;
            background: #f7f8fa;
            position: relative;
            overflow-x: hidden;
        }

        .wang_statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 22px 4px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--ink);
            background: var(--surface);
        }

        .wang_statusbar .wang_ic { width: 15px; height: 15px; color: var(--ink); }
        .wang_statusbar-icons { display: inline-flex; gap: 7px; }

        .wang_app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .wang_app-header h1 { margin: 0; font-size: 1.06rem; flex: 1; }
        .wang_app-header .wang_ic { width: 21px; height: 21px; color: var(--ink); }

        .wang_search {
            margin: 14px 16px;
            padding: 9px 14px;
            border-radius: 999px;
            background: #eceff2;
            color: var(--muted);
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wang_search .wang_ic { width: 14px; height: 14px; color: var(--muted); }

        .wang_banner {
            margin: 0 16px 16px;
            padding: 22px 20px;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(120deg, #c2543f, var(--coral) 60%, #f0917d);
            box-shadow: 0 12px 26px rgba(232, 117, 97, 0.32);
        }

        .wang_banner strong { display: block; font-size: 1.12rem; margin-bottom: 4px; }
        .wang_banner p { margin: 0; font-size: 0.8rem; opacity: 0.88; }
        .wang_banner .wang_ic { float: right; width: 40px; height: 40px; color: var(--yellow); }

        .wang_cats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 0 16px 20px;
            padding: 18px 12px;
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 6px 16px rgba(23, 43, 58, 0.06);
        }

        .wang_cat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            font-size: 0.75rem;
            color: var(--ink);
            text-decoration: none;
        }

        .wang_cat-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: rgba(232, 117, 97, 0.12);
            color: var(--coral);
        }

        .wang_cat-icon .wang_ic { width: 22px; height: 22px; }

        .wang_section-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin: 4px 18px 12px;
        }

        .wang_section-title h2 { margin: 0; font-size: 0.98rem; }
        .wang_section-title span { color: var(--muted); font-size: 0.75rem; }

        .wang_products {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 0 16px 24px;
        }

        .wang_product {
            padding: 12px;
            border-radius: 12px;
            background: var(--surface);
            box-shadow: 0 6px 16px rgba(23, 43, 58, 0.06);
        }

        .wang_product-img {
            display: grid;
            place-items: center;
            height: 78px;
            margin-bottom: 10px;
            border-radius: 9px;
            background: linear-gradient(135deg, #fdeadd, #f8cfa4);
            color: #b8860b;
        }

        .wang_product-img .wang_ic { width: 34px; height: 34px; }

        .wang_product strong { display: block; font-size: 0.82rem; margin-bottom: 3px; }
        .wang_product .wang_price { color: var(--coral); font-size: 0.9rem; font-weight: 800; }
        .wang_product .wang_price small { font-size: 0.68rem; }

        .wang_tip-card {
            margin: 0 16px 110px;
            padding: 18px 20px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            font-size: 0.82rem;
            color: var(--muted);
        }

        .wang_tip-card strong { display: block; margin-bottom: 6px; color: var(--teal-dark); }

        .wang_tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 10;
            display: flex;
            width: 100%;
            background: rgba(255, 255, 255, 0.94);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .wang_tab {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 9px 0 7px;
            color: #9aa7b0;
            text-decoration: none;
            transition: color 200ms ease;
        }

        .wang_tab-icon {
            position: relative;
            display: block;
            width: 24px;
            height: 24px;
            transition: transform 160ms ease;
        }

        .wang_tab-icon svg { width: 100%; height: 100%; display: block; }

        .wang_tab-label { font-size: 0.68rem; letter-spacing: 0.05em; }

        .wang_tab-active { color: var(--teal); font-weight: 700; }
        .wang_tab:active .wang_tab-icon { transform: scale(0.9); }

        .wang_badge {
            position: absolute;
            top: -5px;
            left: calc(50% + 6px);
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border: 1.5px solid #fff;
            border-radius: 9px;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            line-height: 13px;
            text-align: center;
        }

        .wang_dot {
            position: absolute;
            top: 0;
            left: calc(50% + 7px);
            width: 8px;
            height: 8px;
            border: 1.5px solid #fff;
            border-radius: 50%;
            background: var(--red);
        }
    </style>
</head>
